[project]
name = "agente-atendimento"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.16",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.22.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: testes que precisam de Postgres/Redis (excluir com -m 'not integration')",
    "erp: testes contra o ERP simulado real em localhost:8090 (pulam se estiver fora)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain nao importa application, adapters nem infra"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.adapters", "app.infra"]

[[tool.importlinter.contracts]]
name = "application nao importa adapters nem infra"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.adapters", "app.infra"]

[[tool.importlinter.contracts]]
name = "domain e application nao importam bibliotecas de infraestrutura"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = ["openpyxl", "sqlalchemy", "httpx", "fastapi", "anthropic", "redis", "arq"]
