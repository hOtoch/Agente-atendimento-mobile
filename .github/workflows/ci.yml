name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://teste:teste@localhost:5433/teste
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U teste -d teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check
      - name: Ruff (format)
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy app
      - name: Import Linter
        run: uv run lint-imports
      - name: Pytest (com integracao)
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test -- --run
      - name: Build
        run: npm run build

  infra:
    name: Infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Criar .env a partir do exemplo
        run: cp .env.example .env
      - name: Validar docker-compose
        run: docker compose -f infra/docker-compose.yml config -q
