[project]
name = "erp-mock"
version = "0.1.0"
description = "ERP simulado (auth, paginacao, nomes sujos, latencia e falhas) para o Agente de Atendimento Mobile"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
